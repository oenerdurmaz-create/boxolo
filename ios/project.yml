name: BeatBox
options:
  bundleIdPrefix: de.beatbox
  xcodeVersion: "15.0"
targets:
  BeatBox:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BeatBox/Sources
      - path: ../boxreaktion
        name: boxreaktion
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.beatbox.game
        PRODUCT_NAME: BeatBox
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
    info:
      path: BeatBox/Resources/Info.plist
      properties:
        CFBundleName: BeatBox
        CFBundleDisplayName: BeatBox
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "BeatBox erzeugt alle Klänge lokal auf dem Gerät."
