<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<title>BeatBox</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topbar">
  <button id="btn-back" class="navbtn hidden" data-i18n="btn_back">Zurück</button>
  <h1 id="app-title">BeatBox</h1>
  <button id="btn-lang" class="navbtn" aria-label="Language">EN</button>
</header>

<main id="screens">

  <section id="screen-menu" class="screen">
    <p id="menu-sub" class="sub" data-i18n="app_sub"></p>
    <h2 data-i18n="menu_choose_mode"></h2>
    <div id="mode-list"></div>
    <div class="menu-footer">
      <button class="menubtn" id="btn-open-help" data-i18n="btn_help"></button>
      <button class="menubtn" id="btn-open-history" data-i18n="btn_history"></button>
      <button class="menubtn" id="btn-open-calib" data-i18n="btn_calibration"></button>
    </div>
    <p id="calib-status" class="hint"></p>
  </section>

  <section id="screen-levels" class="screen hidden">
    <h2 id="levels-mode-title"></h2>
    <p id="levels-desc" class="sub"></p>
    <div id="level-grid"></div>
    <p class="hint" data-i18n="all_unlocked"></p>
    <p id="best-score" class="hint"></p>
  </section>

  <section id="screen-game" class="screen hidden">
    <div id="hud">
      <span id="hud-score">0</span>
      <span id="hud-hits"></span>
      <span id="hud-streak"></span>
      <span id="hud-time" class="hidden"></span>
    </div>
    <div id="combo-strip" class="hidden">
      <span data-i18n="seq_label"></span>
      <span id="combo-seq"></span>
    </div>
    <p id="distractor-note" class="hint hidden" data-i18n="distractor_warning"></p>
    <div id="zones">
      <button class="zone" data-zone="1"><span class="ring"></span><span class="zlabel"></span></button>
      <button class="zone" data-zone="2"><span class="ring"></span><span class="zlabel"></span></button>
      <button class="zone" data-zone="3"><span class="ring"></span><span class="zlabel"></span></button>
      <button class="zone" data-zone="4"><span class="ring"></span><span class="zlabel"></span></button>
      <button class="zone" data-zone="5"><span class="ring"></span><span class="zlabel"></span></button>
      <button class="zone" data-zone="6"><span class="ring"></span><span class="zlabel"></span></button>
    </div>
    <div id="feedback"></div>
    <div id="big-message" class="hidden"></div>
  </section>

  <section id="screen-result" class="screen hidden">
    <h2 data-i18n="result_title"></h2>
    <dl id="result-list"></dl>
    <div class="row">
      <button class="menubtn" id="btn-again" data-i18n="btn_again"></button>
      <button class="menubtn" id="btn-tomenu" data-i18n="btn_menu"></button>
    </div>
  </section>

  <section id="screen-help" class="screen hidden">
    <h2 data-i18n="help_title"></h2>
    <pre id="help-text"></pre>
  </section>

  <section id="screen-history" class="screen hidden">
    <h2 data-i18n="history_title"></h2>
    <p class="sub" data-i18n="history_info"></p>
    <div id="history-chart"></div>
  </section>

  <section id="screen-calib" class="screen hidden">
    <h2 data-i18n="calib_title"></h2>
    <p class="sub" data-i18n="calib_intro"></p>
    <p class="hint" data-i18n="calib_hint_bt"></p>
    <p id="calib-value" class="highlight"></p>
    <button class="menubtn" id="btn-calib-start" data-i18n="calib_start"></button>
    <div id="calib-feedback" class="hidden"></div>
  </section>

</main>

<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/levels.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
