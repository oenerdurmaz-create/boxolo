# BeatBox – Codemagic-Ablauf für TestFlight.
# Vor dem ersten Start drei Platzhalter ersetzen (siehe README, Abschnitt iOS):
#   1. app_store_connect: Name des App-Store-Connect-API-Schlüssels in Codemagic
#   2. bundle_identifier: identisch mit PRODUCT_BUNDLE_IDENTIFIER in ios/project.yml
#   3. APP_STORE_APPLE_ID: Apple-ID der App aus App Store Connect (App-Informationen)
workflows:
  ios-testflight:
    name: BeatBox iOS TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: BeatBox API-Schluessel
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.example.beatbox
      vars:
        APP_STORE_APPLE_ID: 0000000000
      xcode: latest
    scripts:
      - name: Web-Paket und iOS-Hülle prüfen
        script: node tools/pruefung.js --release
      - name: Xcode-Projekt erzeugen
        script: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Signierprofile übernehmen
        script: xcode-project use-profiles
      - name: Buildnummer erhöhen
        script: |
          cd ios
          LETZTE=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LETZTE + 1))
      - name: IPA bauen
        script: xcode-project build-ipa --project ios/BeatBox.xcodeproj --scheme BeatBox
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
