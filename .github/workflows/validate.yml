name: Pruefskript

on:
  push:
  pull_request:

jobs:
  pruefung:
    name: BeatBox-Paketpruefung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pruefskript
        run: node boxreaktion/tools/pruefung.js
